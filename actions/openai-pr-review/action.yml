name: OpenAI PR Review

description: Generate PR review text with OpenAI and submit a GitHub Pull Request review.

inputs:
  openai_api_key:
    description: OpenAI API key
    required: true
  github_token:
    description: GitHub token with pull-requests:write on caller repo
    required: true
  pr_number:
    description: Pull request number
    required: true
  base_ref:
    description: Base branch ref used to build diff
    required: true
  model:
    description: OpenAI model name
    required: false
    default: gpt-5-mini
  max_diff_chars:
    description: Max diff characters sent to OpenAI
    required: false
    default: "120000"
  review_event:
    description: Review event type (COMMENT, REQUEST_CHANGES, APPROVE)
    required: false
    default: COMMENT
  input_token_price_per_1m_usd:
    description: Optional input token price (USD per 1M tokens) for cost estimate
    required: false
    default: "0"
  output_token_price_per_1m_usd:
    description: Optional output token price (USD per 1M tokens) for cost estimate
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - name: Build PR diff
      shell: bash
      run: |
        set -euo pipefail
        BASE_REF="${{ inputs.base_ref }}"
        git fetch origin "$BASE_REF" --depth=1

        DIFF_FILE=pr.diff
        git diff --unified=1 "origin/$BASE_REF...HEAD" > "$DIFF_FILE"

        MAX_CHARS="${{ inputs.max_diff_chars }}"
        DIFF_LEN=$(wc -c < "$DIFF_FILE")
        if [ "$DIFF_LEN" -gt "$MAX_CHARS" ]; then
          head -c "$MAX_CHARS" "$DIFF_FILE" > pr-truncated.diff
          printf "\n\n[...diff truncated to %s chars...]\n" "$MAX_CHARS" >> pr-truncated.diff
          mv pr-truncated.diff "$DIFF_FILE"
        fi

    - name: Request review from OpenAI Responses API
      id: openai
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        MODEL: ${{ inputs.model }}
      shell: bash
      run: |
        set -euo pipefail

        jq -n \
          --arg model "$MODEL" \
          --rawfile diff pr.diff \
          '{
            model: $model,
            input: [
              {
                role: "system",
                content: "Review changed lines only. Give concise findings with severity, path, and reason. If none, say no issues."
              },
              {
                role: "user",
                content: ("Review this pull request diff:\n\n" + $diff)
              }
            ]
          }' > request.json

        curl -sS https://api.openai.com/v1/responses \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -H "Content-Type: application/json" \
          -d @request.json > response.json

        REVIEW_TEXT="$(jq -r '
          (
            [
              .output_text,
              (.output[]?.content[]? | select((.type // "") == "output_text" or (.type // "") == "text") | .text),
              (.choices[]?.message?.content)
            ]
            | map(select(. != null and . != ""))
            | join("\n\n")
          ) // ""
        ' response.json 2>/dev/null || true)"

        if [ -z "$REVIEW_TEXT" ]; then
          API_ERROR="$(jq -r '.error.message // empty' response.json 2>/dev/null || true)"
          if [ -n "$API_ERROR" ]; then
            REVIEW_TEXT="OpenAI API returned an error: $API_ERROR"
          else
            REVIEW_TEXT="Could not extract review text from OpenAI response. Raw JSON excerpt:\n$(jq -c '.' response.json | head -c 1200)"
          fi
        fi

        INPUT_TOKENS="$(jq -r '.usage.input_tokens // .usage.prompt_tokens // 0' response.json 2>/dev/null || echo 0)"
        OUTPUT_TOKENS="$(jq -r '.usage.output_tokens // .usage.completion_tokens // 0' response.json 2>/dev/null || echo 0)"
        TOTAL_TOKENS="$(jq -r '.usage.total_tokens // 0' response.json 2>/dev/null || echo 0)"

        INPUT_PRICE_PER_1M="${{ inputs.input_token_price_per_1m_usd }}"
        OUTPUT_PRICE_PER_1M="${{ inputs.output_token_price_per_1m_usd }}"

        ESTIMATED_COST_USD="$(awk -v in_t="$INPUT_TOKENS" -v out_t="$OUTPUT_TOKENS" -v in_p="$INPUT_PRICE_PER_1M" -v out_p="$OUTPUT_PRICE_PER_1M" 'BEGIN { printf "%.6f", ((in_t * in_p) + (out_t * out_p)) / 1000000 }')"

        GENERATED_AT_UTC="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        {
          echo "review_body<<EOF"
          echo "## OpenAI API PR Review"
          echo "_Generated: ${GENERATED_AT_UTC} (UTC) · [Run](${RUN_URL})_"
          echo "_Usage: input=${INPUT_TOKENS}, output=${OUTPUT_TOKENS}, total=${TOTAL_TOKENS}_"
          if [ "$INPUT_PRICE_PER_1M" != "0" ] || [ "$OUTPUT_PRICE_PER_1M" != "0" ]; then
            echo "_Estimated cost (USD): ${ESTIMATED_COST_USD}_"
          else
            echo "_Estimated cost: not configured (set input/output token prices in workflow inputs)_"
          fi
          echo
          echo "$REVIEW_TEXT"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Submit GitHub PR review
      uses: actions/github-script@v7
      env:
        REVIEW_BODY: ${{ steps.openai.outputs.review_body }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const { owner, repo } = context.repo;
          const pull_number = Number('${{ inputs.pr_number }}');
          const body = process.env.REVIEW_BODY;
          const event = '${{ inputs.review_event }}'.toUpperCase();
          const allowed = new Set(['COMMENT', 'REQUEST_CHANGES', 'APPROVE']);
          const normalized = allowed.has(event) ? event : 'COMMENT';

          await github.rest.pulls.createReview({
            owner,
            repo,
            pull_number,
            event: normalized,
            body,
          });
