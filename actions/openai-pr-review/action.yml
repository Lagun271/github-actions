name: OpenAI PR Review

description: Generate OpenAI-based PR review summary and inline comments.

inputs:
  openai_api_key:
    description: OpenAI API key
    required: true
  github_token:
    description: GitHub token with pull-requests:write on caller repo
    required: true
  pr_number:
    description: Pull request number
    required: true
  base_ref:
    description: Base branch ref used to build diff
    required: true
  model:
    description: OpenAI model name
    required: false
    default: gpt-5-mini
  max_diff_chars:
    description: Max diff characters sent to OpenAI
    required: false
    default: "120000"
  prompt_file:
    description: Optional path to additional review instructions appended to the default prompt
    required: false
    default: ""
  review_event:
    description: Review event type (COMMENT, REQUEST_CHANGES, APPROVE)
    required: false
    default: COMMENT
  fail_on_severity:
    description: Optional CI failure threshold (high, medium, low)
    required: false
    default: ""
  input_token_price_per_1m_usd:
    description: Optional input token price (USD per 1M tokens) for cost estimate
    required: false
    default: "0"
  output_token_price_per_1m_usd:
    description: Optional output token price (USD per 1M tokens) for cost estimate
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - name: Build PR diff
      shell: bash
      run: |
        set -euo pipefail
        BASE_REF="${{ inputs.base_ref }}"
        git fetch origin "$BASE_REF" --depth=1

        DIFF_FILE=pr.diff
        git diff --unified=1 "origin/$BASE_REF...HEAD" > "$DIFF_FILE"

        MAX_CHARS="${{ inputs.max_diff_chars }}"
        DIFF_LEN=$(wc -c < "$DIFF_FILE")
        if [ "$DIFF_LEN" -gt "$MAX_CHARS" ]; then
          head -c "$MAX_CHARS" "$DIFF_FILE" > pr-truncated.diff
          printf "\n\n[...diff truncated to %s chars...]\n" "$MAX_CHARS" >> pr-truncated.diff
          mv pr-truncated.diff "$DIFF_FILE"
        fi

    - name: Request review and submit PR comments
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        MODEL: ${{ inputs.model }}
        PROMPT_FILE: ${{ inputs.prompt_file }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REVIEW_EVENT: ${{ inputs.review_event }}
        FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        DEFAULT_PROMPT_PATH: ${{ github.action_path }}/default-system-prompt.md
      run: |
        set -euo pipefail
        node "${{ github.action_path }}/src/run-review.js"