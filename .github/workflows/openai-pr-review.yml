name: OpenAI PR Review (Reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number
      base_ref:
        description: Base branch ref for diff computation
        required: true
        type: string
      model:
        description: OpenAI model name
        required: false
        default: gpt-5-mini
        type: string
      max_diff_chars:
        description: Max diff characters sent to OpenAI
        required: false
        default: 120000
        type: number
      prompt_file:
        description: Optional path to additional prompt instructions
        required: false
        default: ""
        type: string
      review_event:
        description: GitHub review event (COMMENT, REQUEST_CHANGES, APPROVE)
        required: false
        default: COMMENT
        type: string
      fail_on_severity:
        description: Optional CI failure threshold (high, medium, low)
        required: false
        default: ""
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OpenAI PR review action
        uses: ./actions/openai-pr-review
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ github.token }}
          pr_number: ${{ inputs.pr_number }}
          base_ref: ${{ inputs.base_ref }}
          model: ${{ inputs.model }}
          max_diff_chars: ${{ inputs.max_diff_chars }}
          prompt_file: ${{ inputs.prompt_file }}
          review_event: ${{ inputs.review_event }}
          fail_on_severity: ${{ inputs.fail_on_severity }}