name: OpenAI PR Review (Reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number
      base_ref:
        description: Base branch ref for diff computation
        required: true
        type: string
      model:
        description: OpenAI model name
        required: false
        default: gpt-5-mini
        type: string
      max_diff_chars:
        description: Max diff characters sent to OpenAI
        required: false
        default: 120000
        type: number
      review_event:
        description: GitHub review event (COMMENT, REQUEST_CHANGES, APPROVE)
        required: false
        default: COMMENT
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR diff
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="${{ inputs.base_ref }}"
          git fetch origin "$BASE_REF" --depth=1

          DIFF_FILE=pr.diff
          git diff --unified=1 "origin/$BASE_REF...HEAD" > "$DIFF_FILE"

          MAX_CHARS=${{ inputs.max_diff_chars }}
          DIFF_LEN=$(wc -c < "$DIFF_FILE")
          if [ "$DIFF_LEN" -gt "$MAX_CHARS" ]; then
            head -c "$MAX_CHARS" "$DIFF_FILE" > pr-truncated.diff
            printf "\n\n[...diff truncated to %s chars...]\n" "$MAX_CHARS" >> pr-truncated.diff
            mv pr-truncated.diff "$DIFF_FILE"
          fi

      - name: Request review from OpenAI Responses API
        id: openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ inputs.model }}
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg model "$MODEL" \
            --rawfile diff pr.diff \
            '{
              model: $model,
              input: [
                {
                  role: "system",
                  content: "Review changed lines only. Give concise findings with severity, path, and reason. If none, say no issues."
                },
                {
                  role: "user",
                  content: ("Review this pull request diff:\n\n" + $diff)
                }
              ]
            }' > request.json

          curl -sS https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json > response.json

          REVIEW_TEXT="$(jq -r '
            (
              [
                .output_text,
                (.output[]?.content[]? | select((.type // "") == "output_text" or (.type // "") == "text") | .text),
                (.choices[]?.message?.content)
              ]
              | map(select(. != null and . != ""))
              | join("\n\n")
            ) // ""
          ' response.json 2>/dev/null || true)"

          if [ -z "$REVIEW_TEXT" ]; then
            API_ERROR="$(jq -r '.error.message // empty' response.json 2>/dev/null || true)"
            if [ -n "$API_ERROR" ]; then
              REVIEW_TEXT="OpenAI API returned an error: $API_ERROR"
            else
              REVIEW_TEXT="Could not extract review text from OpenAI response. Raw JSON excerpt:\n$(jq -c '.' response.json | head -c 1200)"
            fi
          fi

          GENERATED_AT_UTC="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Use a collision-resistant delimiter to prevent EOF injection from AI-generated content
          DELIM="REVIEW_BODY_$(openssl rand -hex 8)"
          {
            echo "review_body<<${DELIM}"
            echo "## OpenAI API PR Review"
            echo "_Generated: ${GENERATED_AT_UTC} (UTC) · [Run](${RUN_URL})_"
            echo
            echo "$REVIEW_TEXT"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Submit GitHub PR review
        uses: actions/github-script@v7
        env:
          REVIEW_BODY: ${{ steps.openai.outputs.review_body }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_EVENT: ${{ inputs.review_event }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const body = process.env.REVIEW_BODY;
            const event = (process.env.REVIEW_EVENT || 'COMMENT').toUpperCase();
            const allowed = new Set(['COMMENT', 'REQUEST_CHANGES', 'APPROVE']);
            const normalized = allowed.has(event) ? event : 'COMMENT';

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              event: normalized,
              body,
            });
